appId: com.ellenwang918.aigoalcalendar
productName: Appa
asar: true
directories:
  output: release
files:
  - dist/client/**/*
  - desktop/**/*
  - server/**/*
  - src/calendar.mjs
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party/**/*
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Appa-${version}-Windows-${arch}-Setup.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
publish: null
